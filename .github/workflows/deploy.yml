name: Build & Deploy Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autosend-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AutoSend AI v1.0.0 Release"
          body: |
            ## 🚀 AutoSend AI - Native Android Auto-Replier & SKEDit Scheduler
            
            ### ✨ Features:
            - **Emerald Glassmorphic UI**: High-fidelity dark glass interface built with Flutter / Dart.
            - **Notification Listener Service**: Automated inline AI WhatsApp replying (`RemoteInput`).
            - **Accessibility Automation**: Automated chat opening, text typing, and send button clicks.
            - **Exact Alarms Engine**: High precision scheduling with Doze mode battery bypass.
            - **AI Engine**: Gemini & OpenAI smart auto-reply integration.
            
            ### 📲 Download:
            Download and install `app-release.apk` below on your Android device!
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

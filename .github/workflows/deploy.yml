name: Build & Deploy Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autosend-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Generate Release Tag
        id: tag
        run: echo "TAG=v1.0.$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "AutoSend AI ${{ steps.tag.outputs.TAG }}"
          body: |
            ## 🚀 AutoSend AI — WhatsApp Auto-Reply & Scheduler

            ### ✨ Features:
            - **Emerald Glassmorphic UI** — Flutter dark glass interface with neon accents.
            - **Notification Listener Service** — AI-powered inline WhatsApp auto-reply (`RemoteInput`).
            - **Accessibility Automation** — Automated chat open, type, and send.
            - **Exact Alarms Engine** — High-precision scheduling with Doze bypass.
            - **AI Engine** — Gemini & OpenAI smart auto-reply integration.

            ### 📲 Install:
            Download `app-release.apk` below and install on your Android device.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build & Deploy Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniflow-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Generate Release Tag
        id: tag
        run: echo "TAG=v1.0.$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "OmniFlow AI ${{ steps.tag.outputs.TAG }}"
          body: |
            ## 🌟 OmniFlow AI — WhatsApp Automation, Bulk Dispatcher & AI Replier

            ### ✨ Features Included:
            - **5-Tab Bulk Sender Studio** — Dashboard, Contacts directory, Direct country code input (+234 default), Recent logs, and Favourites.
            - **Strict Approval Gate** — Zero messages sent without your explicit review & confirmation.
            - **100% Natural Human Messages** — Clean text without any AI indicator footers or bot tags.
            - **Dynamic Variables** — Replace `{name}`, `{first_name}`, `{time}`, `{date}`, `{phone}` on the fly.
            - **Multi-Client WhatsApp Support** — Seamless routing for WhatsApp, WhatsApp Business, and GB WhatsApp.
            - **Android Quick Settings Tile** — Notification shade tile for 1-tap toggle.
            - **Emerald Glassmorphic UI** — High-end dark theme with blur and neon accents.

            ### 📲 Install:
            Download `app-release.apk` below and install directly on your Android phone.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
